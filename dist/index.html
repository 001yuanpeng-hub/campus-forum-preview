<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="重电校园站，面向同学的校园问答与经验分享原型。">
  <meta name="theme-color" content="#ffffff">
  <title>重电校园站 · 校园问答与经验分享</title>
  <link rel="stylesheet" href="styles.css">
  <script defer src="app.js"></script>
</head>
<body>
  <svg class="sprite" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
    <symbol id="i-logo" viewBox="0 0 24 24"><path d="M3 18V9l9-5 9 5v9M7 19v-6l5-3 5 3v6M12 14v6"/></symbol>
    <symbol id="i-home" viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4.5 4.5"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-book" viewBox="0 0 24 24"><path d="M12 6a7 7 0 0 0-8-1v14a7 7 0 0 1 8 1 7 7 0 0 1 8-1V5a7 7 0 0 0-8 1v14"/></symbol>
    <symbol id="i-briefcase" viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2M3 12a20 20 0 0 0 18 0M12 12v3"/></symbol>
    <symbol id="i-leaf" viewBox="0 0 24 24"><path d="M5 19c2-5 6-9 11-11M7 16C3 8 12 5 20 4c0 9-3 16-11 15"/></symbol>
    <symbol id="i-megaphone" viewBox="0 0 24 24"><path d="M3 10v4a1 1 0 0 0 1 1h4l8 4V5l-8 4H4a1 1 0 0 0-1 1zm5-1v6m-2 0 2 5h3l-2-4m10-5h2m-2-4 2-1m-2 9 2 1"/></symbol>
    <symbol id="i-pin" viewBox="0 0 24 24"><path d="M19 10c0 5-7 10-7 10S5 15 5 10a7 7 0 1 1 14 0Z"/><circle cx="12" cy="10" r="2.4"/></symbol>
    <symbol id="i-map" viewBox="0 0 24 24"><path d="m3 6 6-3 6 3 6-3v15l-6 3-6-3-6 3zM9 3v15m6-12v15"/></symbol>
    <symbol id="i-flag" viewBox="0 0 24 24"><path d="M5 21V4c4-3 8 3 14 0v10c-6 3-10-3-14 0"/></symbol>
    <symbol id="i-waves" viewBox="0 0 24 24"><path d="M3 8c3 0 3-2 6-2s3 2 6 2 3-2 6-2M3 13c3 0 3-2 6-2s3 2 6 2 3-2 6-2M3 18c3 0 3-2 6-2s3 2 6 2 3-2 6-2"/></symbol>
    <symbol id="i-compass" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="m15.5 8.5-2 5-5 2 2-5z"/></symbol>
    <symbol id="i-help" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9 9a3 3 0 1 1 4.5 2.6c-1 .6-1.5 1-1.5 2.4m0 2.5h.01"/></symbol>
    <symbol id="i-notes" viewBox="0 0 24 24"><path d="M7 3h11a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2zm2 5h7m-7 4h7m-7 4h4"/></symbol>
    <symbol id="i-chip" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/><path d="M9 3v3m6-3v3m-6 12v3m6-3v3M3 9h3m-3 6h3m12-6h3m-3 6h3m-11-5h4v4h-4z"/></symbol>
    <symbol id="i-team" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3 19v-1a5 5 0 0 1 5-5h2a5 5 0 0 1 5 5v1m1-14a3 3 0 0 1 0 6m2 3a4 4 0 0 1 3 4v1"/></symbol>
    <symbol id="i-id-card" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="8.5" cy="10" r="1.5"/><path d="M6 15a2.5 2.5 0 0 1 5 0m3-5h4m-4 4h4"/></symbol>
    <symbol id="i-link" viewBox="0 0 24 24"><path d="m10 14 4-4m-6 2-2 2a3 3 0 0 0 4 4l3-3m-2-6 3-3a3 3 0 1 1 4 4l-2 2"/></symbol>
    <symbol id="i-chat" viewBox="0 0 24 24"><path d="M20 11.5a8 8 0 0 1-8 8c-1.2 0-2.3-.2-3.4-.7L4 20l1.2-4.2a8 8 0 1 1 14.8-4.3Z"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M19 12H5m6 6-6-6 6-6"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
  </svg>

  <header class="topbar">
    <div class="top-inner">
      <a class="brand" href="#" id="brand"><span class="brand-icon"><svg class="icon"><use href="#i-logo"/></svg></span><span>重电校园站</span></a>
      <form class="search" id="search" role="search">
        <svg class="icon"><use href="#i-search"/></svg>
        <input id="query" type="search" aria-label="搜索校园帖子" placeholder="搜索帖子、课程或关键词" autocomplete="off">
        <kbd aria-hidden="true">/</kbd>
      </form>
      <button class="button primary header-post" data-compose><svg class="icon"><use href="#i-plus"/></svg><span>发布帖子</span></button>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar" aria-label="类别、校区与标签">
      <div class="sidebar-inner">
        <div class="rail-label">社区版块</div>
        <nav id="categories" class="category-nav" aria-label="社区版块"></nav>
        <div class="campus-block">
          <div class="rail-label">按校区筛选</div>
          <div id="campuses" class="campus-filters" role="group" aria-label="按校区筛选"></div>
        </div>
        <div class="tag-block">
          <div class="rail-label">按标签筛选</div>
          <div id="tag-filters" class="tag-filters" role="group" aria-label="按标签筛选"></div>
        </div>
        <p class="rail-footer">重庆电子科技职业大学<br>学生社区原型 · 非官方</p>
      </div>
    </aside>

    <main id="main" tabindex="-1">
      <section id="feed-page" aria-labelledby="feed-title">
        <div class="site-note"><svg class="icon" aria-hidden="true"><use href="#i-compass"/></svg><span>校园问答与经验分享 <span class="note-divider" aria-hidden="true">·</span> <a href="#topic/welcome">发帖指南</a></span><span class="sample-label">演示内容</span></div>
        <h1 id="feed-title" class="visually-hidden">校园讨论</h1>
        <div class="feed-tools" id="feed-tools">
          <div id="tabs" class="feed-tabs" role="group" aria-label="帖子筛选"></div>
          <div class="feed-summary"><span id="feed-subtitle" role="status"></span><button class="text-button" id="reset-filters" type="button" hidden>清除筛选</button></div>
        </div>
        <div id="feed" class="feed"></div>
      </section>
      <section id="topic-page" hidden aria-label="帖子详情"></section>
    </main>
  </div>

  <dialog id="composer" aria-labelledby="composer-title">
    <form id="post-form" class="composer-form">
      <div class="dialog-head"><div><div class="panel-label">校园讨论</div><h2 id="composer-title">发布帖子</h2></div><button class="icon-button" id="close-composer" type="button" aria-label="关闭"><svg class="icon"><use href="#i-close"/></svg></button></div>
      <p class="form-note">演示模式。内容保存在当前浏览器，请使用示例信息。</p>
      <label>标题<input name="title" required maxlength="80" placeholder="一句话说清楚你的问题或经验"></label>
      <fieldset class="choice-set"><legend>类别</legend><div class="choice-grid" id="post-categories"></div></fieldset>
      <label>校区<select name="campus" required></select></label>
      <fieldset class="choice-set"><legend>标签 <span class="choice-hint">可多选</span></legend><div class="choice-grid tag-choices" id="post-tags"></div></fieldset>
      <label>正文<textarea name="body" required maxlength="3000" rows="5" placeholder="写写背景、做过的尝试，或值得记下的步骤。"></textarea></label>
      <div class="dialog-actions"><button class="button secondary" id="cancel-post" type="button">取消</button><button class="button primary" type="submit">发布帖子</button></div>
    </form>
  </dialog>
  <div class="toast" id="toast" role="status" hidden></div>
</body>
</html>
